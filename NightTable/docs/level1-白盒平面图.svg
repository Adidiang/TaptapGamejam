  <text x="90" y="552" font-size="11" fill="#8a8a8a">注：设计图标注「一个大关内每个类型房间数量固定、具体位置随机」，此处按每层 3 战斗 / 2 事件 / 1 调查 写了一份样板用于走查，接玩法时换成按大关种子随机抽取。</text>
  <text x="90" y="572" font-size="11" fill="#8a8a8a">二楼大堂与房间之间为单向门：只能从房间进大堂，返回一次后解锁。</text>
